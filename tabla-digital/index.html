<style>

body{
margin:0;
background: radial-gradient(circle,#1a0033,#000);
color:white;
font-family:Arial;
display:flex;
flex-direction:column;
align-items:center;
min-height:100vh;
padding:10px;
}

.logo{
max-width:100%;
max-height:140px;
object-fit:contain;
display:block;
margin:auto;
}

.topBar{
display:flex;
flex-direction:column;
align-items:center;
gap:10px;
margin-bottom:10px;
width:100%;
}

.topRow{
display:grid;
grid-template-columns:1fr auto 1fr;
align-items:center;
width:100%;
gap:6px;
}

.botonModo{
padding:5px 8px;
font-size:12px;
background:#ffd700;
color:black;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.selectModo{
padding:6px;
border-radius:8px;
display:none;
}

.botonLimpiar{
padding:5px 8px;
font-size:12px;
background:#ff4444;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.topRow .botonLimpiar{
justify-self:start;
}

.topRow .botonModo{
justify-self:center;
}

.topRow .nombreJugador{
justify-self:end;
}


.nombreJugador{
padding:6px 12px;
border-radius:10px;
background:rgba(255,215,0,0.15);
border:1px solid #ffd700;
color:#ffd700;
font-weight:bold;
box-shadow:0 0 10px #ffd700,0 0 20px rgba(255,215,0,0.4);
white-space:nowrap;
}

.contenedor{
background:rgba(0,0,0,0.7);
padding:15px;
border-radius:15px;
box-shadow:0 0 20px #ffd700;
text-align:center;
width:100%;
max-width:400px;
}

.tabla{
display:grid;
grid-template-columns:repeat(5,minmax(0,1fr));
gap:6px;
width:100%;
box-sizing:border-box;
}

.celda{
background:#111;
display:flex;
justify-content:center;
align-items:center;
aspect-ratio:1/1;
font-size:clamp(23px,6.4vw,28px);
border-radius:10px;
font-weight:bold;
border:2px solid #444;
}

.letra{
background:#ffd700;
color:black;
aspect-ratio:auto;
height:30px;
font-size:clamp(21px,5.7vw,25px);
line-height:1;
border-radius:8px;
}

.marcado{
background:#00ff00 !important;
color:black;
box-shadow:0 0 10px #00ff00;
}

.centro{
background:#ffd700 !important;
color:black;
box-shadow:0 0 15px #ffd700,0 0 25px #ffd700;
}

#bingoAnim{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.75);
display:none;
align-items:center;
justify-content:center;
z-index:99999;
}

.bingoCaja{
background:radial-gradient(circle,#3b2600,#000);
border:4px solid #ffd700;
border-radius:25px;
padding:35px 45px;
text-align:center;
box-shadow:0 0 25px #ffd700,0 0 60px rgba(255,215,0,0.8);
animation:entradaBingo .6s ease;
}

.trofeo{
font-size:55px;
margin-bottom:10px;
}

.textoBingo{
font-size:65px;
font-weight:bold;
color:#ffd700;
text-shadow:0 0 10px #fff,0 0 25px #ffd700;
}

.mensajeBingo{
font-size:24px;
color:white;
margin-top:10px;
font-weight:bold;
}

@keyframes entradaBingo{
from{transform:scale(.3);opacity:0;}
to{transform:scale(1);opacity:1;}
}

.bloqueTabla{
margin-bottom:25px;
padding:10px;
border:2px solid #ffd700;
border-radius:15px;
box-shadow:0 0 15px rgba(255,215,0,0.4);
background:rgba(255,255,255,0.03);
}

.expirado{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
color:red;
display:flex;
justify-content:center;
align-items:center;
font-size:24px;
z-index:9999;
}

@media(max-width:420px){

.botonModo,
.botonLimpiar{
font-size:11px;
padding:5px 6px;
white-space:nowrap;
}

.topRow{
gap:4px;
}

.celda{
font-size:clamp(22px,7vw,27px);
}

.letra{
height:28px;
font-size:clamp(20px,6vw,24px);
}

}

/* ===== MENSAJE DÍA DE LAS MADRES ===== */

.mensajeMama{
text-align:center;
margin-top:5px;
margin-bottom:8px;
font-weight:bold;
font-size:22px;
color:#ffd700;
text-shadow:
0 0 5px #ff66cc,
0 0 10px #ff66cc,
0 0 20px #ff66cc;
line-height:1.3;
animation:brilloMama 2s infinite alternate;
}

.mensajeMama span{
font-size:15px;
color:#fff;
text-shadow:
0 0 5px #ff66cc,
0 0 10px #ff66cc;
}

@keyframes brilloMama{
from{
transform:scale(1);
opacity:0.9;
}
to{
transform:scale(1.03);
opacity:1;
}
}

/* ===== FIN MENSAJE DÍA DE LAS MADRES ===== */

  

.videoContainer{
width:100%;
max-width:900px;
aspect-ratio:16/9;
margin:0 auto 15px auto;
border-radius:15px;
overflow:hidden;
box-shadow:0 0 20px #ffd700;
}

.videoContainer iframe{
width:100%;
height:100%;
border:none;
}

</style>
</head>

<body>

<div class="videoContainer">
<iframe
id="youtubeFrame"
src=""
title="Transmisión Bingo"
allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
allowfullscreen>
</iframe>
</div>


<div id="expiradoMsg" class="expirado" style="display:none;">
⛔ Esta tabla ha expirado ⛔
</div>

<div class="contenedor">

<div class="topBar">

<img id="logo" class="logo">

 <!-- ===== MENSAJE MOTIVACIONAL SEMANAL ===== -->

<div class="mensajeMama">
🎲 ¡LA DIVERSIÓN COMIENZA! 🎲<br>
<span>El próximo número puede cambiarlo todo</span>
</div>

<!-- ===== FIN MENSAJE MOTIVACIONAL ===== -->

<div class="topRow">
<button class="botonLimpiar" onclick="limpiarTabla()">Limpiar tabla</button>
<button class="botonModo" onclick="mostrarModos()">Modo de juego</button>
<div id="nombreJugador" class="nombreJugador"></div>
</div>

<select id="modoSelect" class="selectModo" onchange="seleccionarModo()">
<option value="">-- Elegir modo --</option>
<option>Letra X</option>
<option>Letra L</option>
<option>Letra H</option>
<option>Letra T</option>
<option>Diagonal Izq</option>
<option>Diagonal Der</option>
<option>4 Esquinas</option>
<option>Forma O</option>
<option>Tabla Llena</option>
<option>Personalizado</option>
</select>

</div>

<div id="editorPatron" style="display:none;margin-bottom:10px;">
<div style="margin-bottom:5px;">Selecciona el patrón:</div>
<div id="gridPatron" class="tabla"></div>
<button onclick="guardarPatron()" class="botonModo">Guardar patrón</button>
</div>

<div id="tabla"></div>

</div>

<div id="bingoAnim">
<div class="bingoCaja">
<div class="trofeo">🏆</div>
<div class="textoBingo">🎉 BINGO 🎉</div>
<div class="mensajeBingo">¡FELICIDADES!</div>
</div>
</div>

<script>

let audioCtx=new(window.AudioContext||window.webkitAudioContext)();

function beep(){
let o=audioCtx.createOscillator();
let g=audioCtx.createGain();
o.connect(g);
g.connect(audioCtx.destination);
o.frequency.value=800;
o.start();
g.gain.exponentialRampToValueAtTime(0.00001,audioCtx.currentTime+0.15);
}

function generarTablaPorID(id){

let seed=12345;

function random(){
seed=(seed*9301+49297)%233280;
return seed/233280;
}

function randomUnique(min,max,count){
let nums=[];
while(nums.length<count){
let n=Math.floor(random()*(max-min+1))+min;
if(!nums.includes(n)) nums.push(n);
}
return nums;
}

let tabla;

for(let t=1;t<=id;t++){

let B=randomUnique(1,15,5);
let I=randomUnique(16,30,5);
let N=randomUnique(31,45,5);
let G=randomUnique(46,60,5);
let O=randomUnique(61,75,5);

tabla=[];
for(let i=0;i<5;i++){
tabla[i]=[B[i],I[i],N[i],G[i],O[i]];
}
tabla[2][2]="T"+String(t).padStart(3,'0');

}

return tabla;
}

let modoActual="";
let patronPersonalizado=Array(5).fill().map(()=>Array(5).fill(false));
let estados=[];
let bingoActivo=false;
let bingoYaMostrado=false;

function mostrarModos(){
let s=document.getElementById("modoSelect");
s.style.display=s.style.display==="block"?"none":"block";
}

function seleccionarModo(){

modoActual=document.getElementById("modoSelect").value;

if(modoActual==="Personalizado"){
document.getElementById("editorPatron").style.display="block";
crearEditorPatron();
}else{
document.getElementById("editorPatron").style.display="none";
}

}

function limpiarTabla(){

document.querySelectorAll(".celda.marcado").forEach(c=>{
c.classList.remove("marcado");
});

estados.forEach(tabla=>{
for(let i=0;i<5;i++){
for(let j=0;j<5;j++){
tabla[i][j]=(i===2 && j===2);
}
}
});

modoActual="";
document.getElementById("modoSelect").value="";
document.getElementById("editorPatron").style.display="none";
bingoActivo=false;
bingoYaMostrado=false;

}

function crearEditorPatron(){

const grid=document.getElementById("gridPatron");
grid.innerHTML="";

for(let i=0;i<5;i++){
for(let j=0;j<5;j++){

let d=document.createElement("div");
d.className="celda";

if(i===2 && j===2){
d.textContent="★";
d.style.background="#ffd700";
}else{

d.onclick=()=>{
patronPersonalizado[i][j]=!patronPersonalizado[i][j];
d.classList.toggle("marcado");
};

}

grid.appendChild(d);

}
}
}

function guardarPatron(){
document.getElementById("editorPatron").style.display="none";
alert("Patrón guardado");
}

function verificar(m){

const c=(i,j)=>m[i][j]||(i===2&&j===2);

switch(modoActual){

case "Letra X":
return c(0,0)&&c(1,1)&&c(2,2)&&c(3,3)&&c(4,4)&&
c(0,4)&&c(1,3)&&c(3,1)&&c(4,0);

case "Letra L":
return [0,1,2,3,4].every(i=>c(i,0))&&
[0,1,2,3,4].every(j=>c(4,j));

case "Letra H":
return [0,1,2,3,4].every(i=>c(i,0)&&c(i,4))&&
[0,1,2,3,4].every(j=>c(2,j));

case "Letra T":
return [0,1,2,3,4].every(j=>c(0,j))&&
[0,1,2,3,4].every(i=>c(i,2));

case "Diagonal Izq":
return [0,1,2,3,4].every(i=>c(i,i));

case "Diagonal Der":
return [0,1,2,3,4].every(i=>c(i,4-i));

case "4 Esquinas":
return c(0,0)&&c(0,4)&&c(4,0)&&c(4,4);

case "Forma O":
return [0,1,2,3,4].every(j=>c(0,j)&&c(4,j))&&
[1,2,3].every(i=>c(i,0)&&c(i,4));

case "Tabla Llena":
return m.flat().every(v=>v);

case "Personalizado":

for(let i=0;i<5;i++){
for(let j=0;j<5;j++){
if(patronPersonalizado[i][j]&&!m[i][j]&&!(i===2&&j===2)){
return false;
}
}
}
return true;

default:
return false;
}

}

function mostrarBingo(){

if(bingoActivo) return;

bingoActivo=true;
bingoYaMostrado=true;

let contenedor=document.querySelector(".contenedor");
let anim=document.getElementById("bingoAnim");

contenedor.style.display="none";
anim.style.display="flex";

setTimeout(()=>{
anim.style.display="none";
contenedor.style.display="block";
bingoActivo=false;
},5000);

}

/* ROUTE_PARSER_START */
function decodificarSegmento(valor){
try{
return decodeURIComponent(valor);
}catch(error){
return valor;
}
}

function normalizarFecha(valor){
if(!valor) return "";

const limpio=String(valor).trim();
const coincidencia=limpio.match(/^(\d{4})-?(\d{2})-?(\d{2})$/);
if(!coincidencia) return "";

const [,anio,mes,dia]=coincidencia;
const fecha=new Date(Number(anio),Number(mes)-1,Number(dia));

if(
fecha.getFullYear()!==Number(anio) ||
fecha.getMonth()!==Number(mes)-1 ||
fecha.getDate()!==Number(dia)
){
return "";
}

return anio+"-"+mes+"-"+dia;
}

function nombreDesdeSlug(valor){
return decodificarSegmento(valor || "")
.replace(/[-_]+/g," ")
.replace(/\s+/g," ")
.trim();
}

function leerDatosEnlace(pathname,search){
const params=new URLSearchParams(search || "");
const segmentos=String(pathname || "")
.split("/")
.filter(Boolean)
.map(decodificarSegmento);

const indice=segmentos.lastIndexOf("tabla-digital");
const tieneRutaProfunda=indice>=0 && segmentos.length>indice+1;

if(tieneRutaProfunda){
const listaRuta=segmentos[indice+1] || "";
const venceRuta=normalizarFecha(segmentos[indice+2] || "");
const nombreRuta=nombreDesdeSlug(segmentos[indice+3] || "");
const videoRuta=segmentos[indice+4] || "";

const rutaValida=
/^\d+(,\d+)*$/.test(listaRuta) &&
Boolean(venceRuta) &&
Boolean(nombreRuta) &&
/^[A-Za-z0-9_-]{6,32}$/.test(videoRuta);

if(rutaValida){
return {
lista:listaRuta,
vence:venceRuta,
nombre:nombreRuta,
videoID:videoRuta,
logo:params.get("logo") || "",
formato:"ruta",
invalido:false
};
}

return {
lista:"",
vence:"",
nombre:"",
videoID:"",
logo:"",
formato:"ruta",
invalido:true
};
}

const listaConsulta=params.get("tablas") || "1";

return {
lista:/^\d+(,\d+)*$/.test(listaConsulta) ? listaConsulta : "1",
vence:normalizarFecha(params.get("vence") || ""),
nombre:nombreDesdeSlug(params.get("nombre") || ""),
videoID:params.get("video") || "",
logo:params.get("logo") || "",
formato:"consulta",
invalido:false
};
}
/* ROUTE_PARSER_END */

const datosEnlace=leerDatosEnlace(
window.location.pathname,
window.location.search
);

const videoID=datosEnlace.videoID;
const vence=datosEnlace.vence;
const nombre=datosEnlace.nombre;

function hoyStr(){
let d=new Date();
return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,'0')+"-"+String(d.getDate()).padStart(2,'0');
}

if(datosEnlace.invalido){
document.getElementById("expiradoMsg").textContent="⛔ Enlace de tabla inválido ⛔";
document.getElementById("expiradoMsg").style.display="flex";
document.querySelector(".contenedor").style.display="none";
document.querySelector(".videoContainer").style.display="none";
}

if(!datosEnlace.invalido && vence && vence < hoyStr()){
document.getElementById("expiradoMsg").style.display="flex";
document.querySelector(".contenedor").style.display="none";
document.querySelector(".videoContainer").style.display="none";
}

if(nombre){
document.getElementById("nombreJugador").textContent=
nombre.toLocaleUpperCase("es-CO");
}

if(videoID){
document.getElementById("youtubeFrame").src=
"https://www.youtube.com/embed/"+videoID;
}else{
document.querySelector(".videoContainer").style.display="none";
}

function baseArchivos(){
const ruta=window.location.pathname;
if(ruta.includes("/tabla-digital/")) return "/tabla-digital/";
if(ruta.includes("/bingo-digital/")) return "/bingo-digital/";
return "./";
}

const logo=document.getElementById("logo");
const nombreLogo=datosEnlace.logo
? datosEnlace.logo.replace(/[^A-Za-z0-9_-]/g,"")+".png"
: "laterraza.png";

logo.src=baseArchivos()+nombreLogo;

let lista=datosEnlace.lista || "1";
let ids=lista.split(",").map(n=>parseInt(n,10)).filter(n=>Number.isInteger(n) && n>0);

const contenedor=document.getElementById("tabla");

if(datosEnlace.invalido){
ids=[];
}

ids.forEach(id=>{

let tabla=generarTablaPorID(id);

let bloque=document.createElement("div");
bloque.className="bloqueTabla";

let grid=document.createElement("div");
grid.className="tabla";

const letras=["B","I","N","G","O"];

letras.forEach(l=>{
let d=document.createElement("div");
d.className="celda letra";
d.textContent=l;
grid.appendChild(d);
});

let estado=Array(5).fill().map(()=>Array(5).fill(false));
estados.push(estado);

for(let i=0;i<5;i++){
for(let j=0;j<5;j++){

let valor=tabla[i][j];

let d=document.createElement("div");
d.className="celda";
d.textContent=valor;

if(i===2 && j===2){
d.classList.add("centro");
estado[i][j]=true;
}else if(typeof valor==="number"){

d.onclick=()=>{

if(bingoActivo) return;

beep();

d.classList.toggle("marcado");
estado[i][j]=d.classList.contains("marcado");

if(verificar(estado)){

if(!bingoYaMostrado){
mostrarBingo();
}

}else{

// Si la figura deja de estar completa, permite un nuevo bingo
bingoYaMostrado=false;

}

};

}

grid.appendChild(d);

}
}

bloque.appendChild(grid);
contenedor.appendChild(bloque);

});

</script>

</body>
